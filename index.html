const voteLabel = s => s % 60 ? `${s}秒` : `${s / 60}分`;
/* 設定:基本ルールと法律の有効・無効 */
function cfgHtml(pub) {
  const c = pub.cfg;
  const tg = (key, on, nm, tx, art, cls) => `<button class="tg ${on ? 'on' : 'off'}" data-cfg="${key}"><span>${art || ''}</span><span><span class="nm">${nm}</span>${tx ? `<span class="tx ${cls || ''}">${tx}</span>` : ''}</span><span class="sw"></span></button>`;
  const seg = (key, vals, cur, fmt) => `<span class="seg">${vals.map(v => `<button class="${v === cur ? 'on' : ''}" data-cfg="${key}:${v}">${fmt ? fmt(v) : v}</button>`).join('')}</span>`;
  const why = k => !c.laws[k] ? '' : (k === 'gekokujo' && !c.rev) ? '革命が無効のため、候補に出ません' : (k === 'joker' && !c.jokers) ? 'ジョーカーがないため、候補に出ません' : '';
  const rules = E.RULES.map(r => tg('rule:' + r.key, c[r.key], r.name, r.text)).join('')
    + `<div class="tg na"><span></span><span><span class="nm">ジョーカー</span><span class="tx">山札に入れる枚数</span></span>${seg('jokers', [0, 1, 2], c.jokers, v => v + '枚')}</div>`;
  const vote = c.lawsOn ? `<div class="tg na sess"><span><span class="nm">法律の上限</span><span class="tx">超えると古い順に失効</span></span>${seg('maxLaws', [1, 2, 3, 4, 5], c.maxLaws, v => v + 'つ')}</div>` : '';
  const laws = tg('lawsOn', c.lawsOn, '法律を作る', '回が終わるたびに投票で法律を一つ決める') + vote + (c.lawsOn ? E.LAW_KEYS.map(k => {
    const w = why(k);
    return tg('law:' + k, c.laws[k] && !w, pub.lawInfo[k].name, w || pub.lawInfo[k].text, I.lawPlain(k), w ? 'why' : 'lt');
  }).join('') : '');
  const session = `<h3>会期</h3><div class="tg na sess"><span><span class="nm">回数</span><span class="tx">最終回が終わると閉会。「なし」は回数を決めない</span></span>${seg('rounds', E.ROUND_OPTS, c.rounds, v => v ? v + '回' : 'なし')}</div>${c.rounds ? tg('lastx2', c.lastx2, '最終回は得点二倍', '倍点令とは重ならない') : ''}`;
  const locals = E.LOCAL_RULES.map(r => tg('rule:' + r.key, c[r.key], r.name, r.text)).join('');
  return `<div class="cfg"><div><h3>基本ルール</h3>${rules}${session}</div><div><h3>ローカルルール</h3>${locals}</div><div class="lawcol"><h3>法律</h3>${laws}</div></div>`;
}
function cfgSummary(c) {
  const off = E.RULES.filter(r => !c[r.key]).map(r => r.name);
  const loc = E.LOCAL_RULES.filter(r => c[r.key]).map(r => r.name);
  const lawN = E.LAW_KEYS.filter(k => E.lawUsable(c, k)).length;
  return `会期は${roundsText(c)}。${off.length ? `基本ルールのうち${off.join('・')}はなし。` : '基本ルールはすべてあり。'}${loc.length ? `ローカルルールは${loc.join('・')}。` : ''}${c.lawsOn ? `法律の候補は${lawN}つ、上限は${c.maxLaws}つ。` : '法律は作りません。'}`;
}
function vTv(pub) {
  if (S.showTypes) return vTypes(pub);
  if (pub.phase === 'lobby') return vTvLobby(pub);
  if (pub.phase === 'brief') return sheet(pub, vTvBrief(pub), true);
  if (pub.phase === 'roundEnd') return sheet(pub, `<div class="eyebrow">${pub.last ? `最終回(第${pub.round}回)本会議の結果` : `第${pub.round}回 本会議の結果${pub.cfg.rounds ? `(会期 全${pub.cfg.rounds}回)` : ''}`}${x2Text(pub.results[0]) ? '　' + x2Text(pub.results[0]) : ''}</div><div class="big">大富豪は${esc(pname(pub, pub.order[0]))}さん</div>${resultsTable(pub)}${standingHtml(pub)}${commentHtml(pub)}`);
  if (pub.phase === 'mark') return sheet(pub, vTvMark(pub));
  if (pub.phase === 'vote') return sheet(pub, vTvVote(pub));
  if (pub.phase === 'enacted') return sheet(pub, vTvEnacted(pub));
  if (pub.phase === 'diag') return sheet(pub, vTvDiag(pub), true);
  const f = pub.field;
  const who = f.topIds.length ? `<div class="who">${esc(pname(pub, f.topPid))}さん　${esc(E.describe(f.top))}</div>` : '<div class="who">&nbsp;</div>';
  // 席は手番の順(参加順)に、卓を囲んで時計回りに並べる。1人目は手前の中央
  const n = pub.players.length, pts = pub.points || {};
  const RX = 38, RY = 38;
  const ang = i => (90 + i * 360 / n) * Math.PI / 180;
  const players = pub.players.map((p, i) => {
    const st = p.out > 0 ? `${p.out}番目に上がり` : p.out === -1 ? '都落ち' : p.out === -2 ? '反則上がり' : p.passed ? 'パス' : pub.turn === p.id ? '考え中' : (f.topPid === p.id && f.topIds.length) ? '<span class="lp">場の札</span>' : '';
    const x = 50 + RX * Math.cos(ang(i)), y = 50 + RY * Math.sin(ang(i));
    return `<div class="tv-p seat ${pub.turn === p.id ? 'turn' : ''} ${p.out ? 'out' : ''}" style="left:${x.toFixed(2)}%;top:${y.toFixed(2)}%">
      <span class="sno">議席${i + 1}</span>
      <div class="sh"><span class="nm">${esc(p.name)}</span><span class="pt">${pts[p.id] || 0}<small>点</small></span></div>
      <div class="r2"><span class="tt">${rankTag(p.title)}</span><span class="hold">${p.out ? '' : backsHtml(p.count, 6)}<span class="ct">${p.count}<small>枚</small></span></span></div>
      <div class="st">${st || '&nbsp;'}</div></div>`;
  }).join('');
  // 回る向き:席と席のあいだに、卓の縁に沿った矢印を置く(9リバースで逆向きになる)
  const dir = pub.dir === -1 ? -1 : 1;
  let arrows = '';
  for (let i = 0; i < n; i++) {
    const t = ang(i) + Math.PI / n;
    const x = 50 + RX * Math.cos(t), y = 50 + RY * Math.sin(t);
    const deg = Math.atan2(RY * Math.cos(t), -RX * Math.sin(t)) * 180 / Math.PI + (dir === -1 ? 180 : 0);
    arrows += `<span class="ring-arrow" style="left:${x.toFixed(2)}%;top:${y.toFixed(2)}%;transform:translate(-50%,-50%) rotate(${deg.toFixed(1)}deg)"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 1.5L7.5 5 2 8.5"/></svg></span>`;
  }
  return `<div class="tv"><main class="tv-main ring-main">
    <div class="tv-head"><span class="round">${roundLabel(pub)}</span><span class="chips">${fieldInfo(pub)}</span></div>
    <div class="ring" style="--n:${n}">
      <svg class="ring-line" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><ellipse cx="50" cy="50" rx="${RX}" ry="${RY}"/></svg>
      ${arrows}
      <div class="table ring-table">${pileHtml(pub, '5.4vw')}${who}</div>
      <div class="tv-players">${players}</div>
    </div>
    <div class="ring-foot"><div class="tv-say">${esc(statusLine(pub))}</div><div class="tv-log">${(pub.log || []).slice(-2).map(t => `<div>${esc(t)}</div>`).join('')}</div></div>
  </main>${tvSide(pub)}</div>`;
}

/* 手札を扇形に並べる位置 */
function fanLayout(n) {
  const W = Math.min(window.innerWidth, 520) - 28;
  const cw = Math.max(56, Math.min(74, W / 5));
  const mid = (n - 1) / 2;
  const ang = Math.min(2.6, 22 / Math.max(n, 1));
  // 端の札が傾いてもはみ出さないよう、傾きの分だけ幅を詰める
  const spread = W - cw - 2 * Math.sin(ang * mid * Math.PI / 180) * cw * 1.4 * 1.3 - 8;
  const step = n > 1 ? Math.min(cw * 0.62, spread / (n - 1)) : 0;
  const x0 = (W - (cw + step * (n - 1))) / 2;
  return { cw, pos: i => ({ x: x0 + i * step, r: (i - mid) * ang, y: Math.pow(i - mid, 2) * ang * 0.22 }) };
}
function fanHtml(hand, pub, tap, hint) {
  const L = fanLayout(hand.length);
  const cards = hand.map((id, i) => {

    case 'go-join': S.view = 'join'; render(); break;
    case 'do-host': {
      const name = (document.getElementById('name').value || '').trim();
      if (!name) { S.err = '名前を入力してください。'; render(); return; }
      S.name = name; store.set('dfg-name', name); await beginPhoneHost(name); break;
    }
    case 'do-join': {
      const code = (document.getElementById('code').value || '').trim().toUpperCase();
      const name = (document.getElementById('name').value || '').trim();
      if (code.length !== 4) { S.err = '議場の番号は4文字です。'; render(); return; }
      if (!name) { S.err = '名前を入力してください。'; render(); return; }
      S.name = name; store.set('dfg-name', name);
      try { if (!(await roomExists(code))) { S.err = 'その番号の議場が見つかりません。'; render(); return; } }
      catch (e) { S.err = '通信できませんでした。電波の状態を確かめてください。'; render(); return; }
      await joinRoom(code, name); break;
    }
    case 'laws': S.showLaws = !S.showLaws; render(); break;
    case 'sound': SFX.setMuted(!SFX.isMuted()); if (!SFX.isMuted()) SFX.play('gavel'); render(); break;
    case 'bgm': SFX.setBgm(!SFX.bgmOn()); render(); soundButton(); break;
    case 'cfg-open': S.showCfg = true; render(); break;
    case 'types-open': S.showTypes = true; S.openType = null; lastHtml = ''; render(); window.scrollTo(0, 0); break;
    case 'types-close': S.showTypes = false; lastHtml = ''; render(); break;
    case 'brief-next': send({ t: 'brief', step: (S.pub.brief || 0) + 1 }); break;
    case 'brief-back': send({ t: 'brief', step: Math.max(0, (S.pub.brief || 0) - 1) }); break;
    case 'begin': send({ t: 'begin' }); break;
    case 'close-vote': send({ t: 'close-vote' }); break;
    case 'cfg-close': S.showCfg = false; render(); break;
    case 'cfg-reset': send({ t: 'cfg', cfg: E.defaultCfg() }); break;
    case 'play': send({ t: 'play', ids: [...S.sel] }); S.sel.clear(); break;
    case 'pass': send({ t: 'pass' }); S.sel.clear(); break;
    case 'exchange': send({ t: 'exchange', ids: [...S.sel] }); S.sel.clear(); break;
    case 'tsure': send({ t: 'tsure', id: [...S.sel][0] }); S.sel.clear(); break;
    case 'tsure-skip': send({ t: 'tsure', id: null }); S.sel.clear(); break;
    case 'give7': case 'drop10': send({ t: a, ids: [...S.sel] }); S.sel.clear(); break;
    case 'give7-skip': case 'drop10-skip': send({ t: a.replace('-skip', ''), ids: [] }); S.sel.clear(); break;
    case 'gekokujo': send({ t: 'gekokujo', target: S.choice }); S.choice = null; break;
    case 'mark': send({ t: 'mark', key: S.choice }); S.choice = null; break;
    case 'vote': send({ t: 'vote', key: S.choice }); S.choice = null; break;
    case 'param': { const v = pr.key === 'fav' ? S.choice : parseInt(S.choice, 10); send({ t: 'param', v }); S.choice = null; break; }
    case 'diag-next': S.diagStep = S.diagStep > S.pub.players.length ? 0 : S.diagStep + 1; if (S.diagStep >= 1 && S.diagStep <= S.pub.players.length) SFX.play('drumroll'); render(); break;
    case 'again': S.diagStep = 0; send({ t: 'again' }); break;
    case 'start': case 'cpu+': case 'cpu-': case 'next': case 'finish': S.diagStep = 0; send({ t: a }); break;
  }
});

/* 手札:タップで選ぶ。選んだ札を上へ払うと出す */
let drag = null;
document.addEventListener('pointerdown', ev => {
  const c = ev.target.closest('.fan.live [data-card]');
  if (!c) return;
  drag = { id: c.dataset.card, x: ev.clientX, y: ev.clientY, dy: 0, moved: false };
  S.dragging = true;
});
document.addEventListener('pointermove', ev => {
  if (!drag) return;
  const dy = ev.clientY - drag.y, dx = ev.clientX - drag.x;
  if (Math.abs(dy) > 8 || Math.abs(dx) > 8) drag.moved = true;
  drag.dy = dy;
  if (dy < -6 && S.canPlay) {
    const ids = S.sel.has(drag.id) ? [...S.sel] : [];
    document.querySelectorAll('.fan .card').forEach(el => { el.style.setProperty('--lift', ids.includes(el.dataset.card) ? Math.max(dy, -160) + 'px' : '0px'); });
    const fan = document.querySelector('.fan'); if (fan) fan.classList.toggle('armed', dy < -70 && ids.length > 0);
  }
});
function endDrag(ev) {
  if (!drag) return;
  const d = drag; drag = null; S.dragging = false;
  if (!d.moved) {
    if (S.sel.has(d.id)) S.sel.delete(d.id); else S.sel.add(d.id);
    SFX.play('select');
  } else if (d.dy < -70 && S.canPlay && S.sel.has(d.id)) {
    send({ t: 'play', ids: [...S.sel] }); S.sel.clear();
  }
  lastHtml = ''; render();
}
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', endDrag);
window.addEventListener('resize', () => { lastHtml = ''; render(); });

/* ---------- 起動 ---------- */
async function beginPhoneHost(name) {
  let code = qs.get('code');
  if (!code) { code = newCode(); try { for (let i = 0; i < 5 && !LOCAL && await roomExists(code); i++) code = newCode(); } catch (e) { /* 確かめられなくても進める */ } }
  S.code = code; S.isHost = true; S.view = 'phone';
  S.pid = qs.get('pid') || store.get('dfg-pid-' + code) || rid(); store.set('dfg-pid-' + code, S.pid);
  render();
  try { await startHost(code, 'phone', S.pid); } catch (e) { S.err = '議場を開けませんでした。通信の設定を確かめてください。'; render(); return; }
  HOST.local(S.pid, { t: 'join', name });
  history.replaceState(null, '', baseUrl() + '?host&code=' + code + (LOCAL ? '&local=1' : ''));
}
async function joinRoom(code, name) {
  S.code = code; S.view = 'phone'; S.err = '';
  if (name) store.set('dfg-name', name);  // ホームから続きに戻るとき、名前を入れ直さずに済むように
  S.pid = qs.get('pid') || store.get('dfg-pid-' + code) || rid(); store.set('dfg-pid-' + code, S.pid);
  render();
  S.net = await clientNet(code, S.pid, pub => { S.pub = pub; S.pubAt = Date.now(); render(); }, priv => { S.priv = priv; render(); });
  const join = () => S.net.send({ t: 'join', name, auto: qs.has('auto') });
  join();
  // 親が後から開いた場合に備えて、参加が反映されるまで送り直す
  const retry = setInterval(() => { if (S.pub && S.pub.players.some(p => p.id === S.pid)) clearInterval(retry); else join(); }, 1500);
  history.replaceState(null, '', baseUrl() + '?room=' + code + (LOCAL ? '&local=1' : ''));
}
async function boot() {
  S.name = store.get('dfg-name') || '';
  if (qs.has('demo')) { bootDemo(); return; }
  if (qs.has('tv')) {
    let code = qs.get('code');
    if (!code) { code = newCode(); try { for (let i = 0; i < 5 && !LOCAL && await roomExists(code); i++) code = newCode(); } catch (e) { /* 確かめられなくても進める */ } }
    S.view = 'tv'; S.isHost = true; S.code = code; render();
    try { await startHost(code, 'tv', null); } catch (e) { S.err = '議場を開けませんでした。通信の設定を確かめてください。'; render(); return; }
    history.replaceState(null, '', baseUrl() + '?tv&code=' + code + (LOCAL ? '&local=1' : ''));
    for (let i = 0; i < (parseInt(qs.get('cpu'), 10) || 0); i++) HOST.local('tv', { t: 'cpu+' });
    return;
  }
  if (qs.has('host') && qs.get('code') && S.name) { await beginPhoneHost(S.name); return; }
  if (qs.has('host')) { S.view = 'hostform'; render(); return; }
  if (qs.get('room')) {
    S.code = qs.get('room').toUpperCase();
    const nm = qs.get('name') || (store.get('dfg-pid-' + S.code) ? S.name : '');
    if (nm) { S.name = nm; await joinRoom(S.code, nm); return; }
    S.view = 'join'; render(); return;
  }
  render();
}
function bootDemo() {
  const code = 'DEMO' ;
  const b = baseUrl();
  const names = ['きむら', 'さとう', 'たなか'];
  document.body.innerHTML = `<div class="demo"><iframe src="${b}?tv&local=1&code=${code}&cpu=1" title="テレビ"></iframe>
    <div class="phones">${names.map((n, i) => `<iframe src="${b}?room=${code}&local=1&name=${encodeURIComponent(n)}&pid=demo${i}${qs.has('auto') ? '&auto=1' : ''}" title="${n}のスマホ"></iframe>`).join('')}</div></div>`;
}
boot();
})();
